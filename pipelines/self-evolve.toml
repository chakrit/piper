# Copy this file to piper.toml or select it with:
# cargo run -- --file pipelines/self-evolve.toml run self-evolve ...
[llm]
invocation = "opencode run -m {{model}} {{prompt}}"
system_prompt = "You are a highly capable AI assistant."
default_model = "cerebras/gemma-4-31b"

[pipelines.self-evolve]
# Shared by the root pipeline and every work-stream fork.
max_turns = 48

[[pipelines.self-evolve.aspects]]
id = "clarify"
name = "Clarify the Change"
type = "worker"
prompt = "Analyze the Request against the specifications. Add one unambiguous criterion at a time with ADD-KNOWLEDGE, then rerun. If a material choice cannot be resolved, return DONE followed by only the question list. When the necessary criteria are in the Corpus, return NEXT."

[[pipelines.self-evolve.aspects]]
id = "distill"
name = "Distill Work Streams"
type = "worker"
prompt = "Identify independent work streams from the Request and Corpus. For each independent branch, return FORK with a unique ID and concise directive; this Aspect reruns after that child completes. Once every branch is complete, return MERGE with their comma-separated IDs. For one stream, return NEXT."

[[pipelines.self-evolve.aspects]]
id = "architect"
name = "Architecture and Abstraction"
type = "worker"
prompt = "Assess the repository design and specifications for a simpler, more reliable abstraction. Record one durable finding at a time with ADD-KNOWLEDGE, then rerun. When the architecture findings are complete, return NEXT."

[[pipelines.self-evolve.aspects]]
id = "restructure"
name = "Restructure Before Feature Work"
type = "worker"
prompt = "Describe the smallest safe refactor that makes the Request straightforward, including affected boundaries and preserved behavior. Record it with ADD-KNOWLEDGE, then rerun. When the plan is complete, return NEXT."

[[pipelines.self-evolve.aspects]]
id = "test-plan"
name = "Test Plan"
type = "worker"
prompt = "Define the narrow failing test, key edge cases, and broad verification command. For untestable documentation or configuration changes, record the substitute verification. Add each item with ADD-KNOWLEDGE, then rerun; return NEXT when complete."

[[pipelines.self-evolve.aspects]]
id = "tdd-red"
name = "TDD Red"
type = "worker"
prompt = "Specify the smallest test slice that should fail for the missing behavior. Reject compile-only failures and tautological assertions. Record the test and expected failure with ADD-KNOWLEDGE, then rerun; return NEXT when complete."

[[pipelines.self-evolve.aspects]]
id = "tdd-green"
name = "TDD Green"
type = "worker"
prompt = "Identify the smallest implementation change that satisfies the red test and no more. Record implementation evidence in the Corpus with ADD-KNOWLEDGE, then rerun; return NEXT when complete."

[[pipelines.self-evolve.aspects]]
id = "tdd-refactor"
name = "TDD Refactor"
type = "worker"
prompt = "Identify improvements to naming, boundaries, and duplication that preserve behavior. Record only necessary cleanup with ADD-KNOWLEDGE, then rerun; return NEXT when complete."

[[pipelines.self-evolve.aspects]]
id = "completion-check"
name = "Completion Check"
type = "worker"
prompt = "Decide whether every accepted requirement and planned test is covered. If anything is missing, return JUMP tdd-red. If complete, return JUMP audit."

[[pipelines.self-evolve.aspects]]
id = "audit"
name = "Alignment Audit"
type = "worker"
prompt = "Audit the Request against the Corpus, accepted specs, test plan, and engineering constraints. Categorize findings as violation, borderline, or out of scope. For a violation, add the corrective next step with ADD-KNOWLEDGE, then rerun and JUMP architect. Otherwise return DONE with a concise completion report."
