# Piper's self-evolving development pipeline. Run with:
# cargo run -- run pipeline.toml ...
[pipeline]
id = "piper-development"
# Shared by the root pipeline and every work-stream fork.
max_turns = 48
# Formatting recovery is exceptional and shares one smaller run-wide budget.
max_recoveries = 3

[[pipeline.aspects]]
id = "clarify"
name = "Clarify the Change"
prompt = "Analyze the Request against the specifications. Use SET to record the consolidated criteria needed by later Aspects, then rerun. If a material choice cannot be resolved, return STOP followed by the blocker. When the necessary criteria are in the Corpus, return CONTINUE."

[[pipeline.aspects]]
id = "distill"
name = "Distill Work Streams"
prompt = "At root, identify independent work streams from the Request and Corpus. For each independent branch, return FORK with a unique ID and concise directive; this Aspect reruns with correlated FORK_KNOWLEDGE after that child returns. In a fork, analyze only the Fork Directive, use SET to record the finding, then return with CONTINUE or JOIN. Once every root branch is complete, use SET to consolidate the pending findings, then return CONTINUE or JOIN to make them durable and advance. For one stream, SET the consolidated finding directly and continue."

[[pipeline.aspects]]
id = "architect"
name = "Architecture and Abstraction"
prompt = "Assess the repository design and specifications for a simpler, more reliable abstraction. Use SET to record the consolidated architecture finding, then rerun. When the architecture finding is complete, return CONTINUE."

[[pipeline.aspects]]
id = "restructure"
name = "Restructure Before Feature Work"
prompt = "Describe the smallest safe refactor that makes the Request straightforward, including affected boundaries and preserved behavior. Use SET to record the consolidated plan, then rerun. When the plan is complete, return CONTINUE."

[[pipeline.aspects]]
id = "test-plan"
name = "Test Plan"
prompt = "Define the narrow failing test, key edge cases, and broad verification command. For untestable documentation or configuration changes, record the substitute verification. Use SET to record the consolidated test plan, then rerun; return CONTINUE when complete."

[[pipeline.aspects]]
id = "tdd-red"
name = "TDD Red"
prompt = "Specify the smallest test slice that should fail for the missing behavior. Reject compile-only failures and tautological assertions. Use SET to record the red test and expected failure, then rerun; return CONTINUE when complete."

[[pipeline.aspects]]
id = "tdd-green"
name = "TDD Green"
prompt = "Identify the smallest implementation change that satisfies the red test and no more. Use SET to record implementation evidence, then rerun; return CONTINUE when complete."

[[pipeline.aspects]]
id = "tdd-refactor"
name = "TDD Refactor"
prompt = "Identify improvements to naming, boundaries, and duplication that preserve behavior. Use SET to record only necessary cleanup, then rerun; return CONTINUE when complete."

[[pipeline.aspects]]
id = "completion-check"
name = "Completion Check"
prompt = "Decide whether every accepted requirement and planned test is covered. If anything is missing, return JUMP tdd-red. If complete, return JUMP audit."

[[pipeline.aspects]]
id = "audit"
name = "Alignment Audit"
prompt = "Audit the Request against the Corpus, accepted specs, test plan, and engineering constraints. Categorize findings as violation, borderline, or out of scope. For a violation, use SET to record the corrective next step, then rerun and JUMP architect. Otherwise return DONE with a concise completion report."
