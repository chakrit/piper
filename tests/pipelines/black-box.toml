[pipeline]
max_turns = 8

[[pipeline.aspects]]
id = "collect"
name = "Collect Knowledge"
prompt = "Set one durable contribution, then continue once it is visible."

[[pipeline.aspects]]
id = "branch"
name = "Branch Work"
prompt = "Fork once, then continue after the completed fork is visible."

[[pipeline.aspects]]
id = "finish"
name = "Finish"
prompt = "Finish with the accumulated Corpus."
