[pipeline]
id = "parallel-arithmetic"
max_turns = 12

[[pipeline.aspects]]
id = "arithmetic"
name = "Parallel Arithmetic"
prompt = "At root, fork three independent term calculations and SET their total after every result returns. In a fork, calculate only its directed term, SET it, then return."

[[pipeline.aspects]]
id = "verify"
name = "Verify Arithmetic"
prompt = "Return the total and every joined term supplied through the Corpus."
