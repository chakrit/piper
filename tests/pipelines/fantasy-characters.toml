[pipeline]
id = "fantasy-characters"
max_turns = 12

[[pipeline.aspects]]
id = "characters"
name = "Fantasy Characters"
prompt = "At root, fork three independent character creations and SET a cast after every result returns. In a fork, create only its directed character, SET it, then return."

[[pipeline.aspects]]
id = "story"
name = "Write Short Story"
prompt = "Write a short story using every character in the joined Corpus."
