<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Design System Colors (Approximated) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888" stroke="none" />
    </marker>
  </defs>

  <!-- Global System Prompt Wrapper -->
  <rect x="10" y="10" width="660" height="430" rx="8" fill="none" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4" />
  <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="500" fill="#888">SYSTEM PROMPT (Global Rules & JSON Schema)</text>

  <!-- Input Stage -->
  <rect x="30" y="80" width="120" height="60" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="0.5" />
  <text x="45" y="105" font-family="sans-serif" font-size="14" font-weight="500" fill="#333">Initial State</text>
  <text x="45" y="125" font-family="sans-serif" font-size="11" fill="#666">Goal + Working Draft</text>

  <!-- Aspect Loop -->
  <!-- Aspect 1 -->
  <rect x="180" y="80" width="140" height="80" rx="4" fill="#f9f9f9" stroke="#333" stroke-width="1" />
  <text x="195" y="105" font-family="sans-serif" font-size="14" font-weight="500" fill="#333">Aspect 1</text>
  <text x="195" y="125" font-family="sans-serif" font-size="11" fill="#666">Prompt + Draft + Corpus</text>
  <text x="195" y="140" font-family="sans-serif" font-size="11" fill="#666">(Corpus is empty)</text>

  <!-- Aspect 2 -->
  <rect x="350" y="80" width="140" height="80" rx="4" fill="#f9f9f9" stroke="#333" stroke-width="1" />
  <text x="365" y="105" font-family="sans-serif" font-size="14" font-weight="500" fill="#333">Aspect 2</text>
  <text x="365" y="125" font-family="sans-serif" font-size="11" fill="#666">Prompt + Draft + Corpus</text>
  <text x="365" y="140" font-family="sans-serif" font-size="11" fill="#666">(Corpus: [A1] decision)</text>

  <!-- Aspect N -->
  <rect x="520" y="80" width="140" height="80" rx="4" fill="#f9f9f9" stroke="#333" stroke-width="1" />
  <text x="535" y="105" font-family="sans-serif" font-size="14" font-weight="500" fill="#333">Aspect N</text>
  <text x="535" y="125" font-family="sans-serif" font-size="11" fill="#666">Prompt + Draft + Corpus</text>
  <text x="535" y="140" font-family="sans-serif" font-size="11" fill="#666">(Corpus: [A1...N-1])</text>

  <!-- Knowledge Corpus Reservoir -->
  <rect x="180" y="250" width="480" height="80" rx="8" fill="#fff" stroke="#333" stroke-width="1" stroke-dasharray="2" />
  <text x="310" y="275" font-family="sans-serif" font-size="16" font-weight="500" fill="#333">KNOWLEDGE CORPUS</text>
  <text x="230" y="300" font-family="sans-serif" font-size="12" fill="#666">{ "id_1": "truth", "id_2": "truth", ... }</text>

  <!-- Final Synthesis -->
  <rect x="320" y="370" width="180" height="60" rx="4" fill="#f9f9f9" stroke="#333" stroke-width="1" />
  <text x="345" y="395" font-family="sans-serif" font-size="14" font-weight="500" fill="#333">Final Synthesis</text>
  <text x="355" y="415" font-family="sans-serif" font-size="11" fill="#666">Draft + Full Corpus</text>

  <!-- Connections: Draft Flow -->
  <line x1="150" y1="110" x2="180" y2="110" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)" />
  <line x1="320" y1="110" x2="350" y2="110" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)" />
  <line x1="490" y1="110" x2="520" y2="110" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)" />
  <path d="M 580 120 Q 600 120 600 200 T 410 370" fill="none" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)" />
  <text x="570" y="200" font-family="sans-serif" font-size="11" fill="#666" text-anchor="end">Final Draft</text>

  <!-- Connections: Knowledge Updates (Down) -->
  <line x1="250" y1="160" x2="250" y2="250" stroke="#333" stroke-width="0.5" marker-end="url(#arrow)" />
  <line x1="420" y1="160" x2="420" y2="250" stroke="#333" stroke-width="0.5" marker-end="url(#arrow)" />
  <line x1="580" y1="160" x2="580" y2="250" stroke="#333" stroke-width="0.5" marker-end="url(#arrow)" />
  <text x="260" y="200" font-family="sans-serif" font-size="11" fill="#333">Add Truth</text>

  <!-- Connections: Knowledge Feed (Up) -->
  <path d="M 180 290 Q 150 290 150 140 T 180 140" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="2" />
  <path d="M 350 290 Q 320 290 320 140 T 350 140" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="2" />
  <path d="M 520 290 Q 490 290 490 140 T 520 140" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="2" />
  <text x="160" y="240" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">Feed Forward</text>

  <!-- Connections: Final Feed -->
  <line x1="410" y1="330" x2="410" y2="370" stroke="#888" stroke-width="0.5" marker-end="url(#arrow)" />
  <text x="420" y="350" font-family="sans-serif" font-size="11" fill="#666">Full Corpus</text>
</svg>
