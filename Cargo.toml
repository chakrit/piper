[package]
name = "piper"
version = "0.1.1-alpha.1"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.150"
toml = "0.8"
dialoguer = "0.11"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = { version = "=0.11.0", default-features = false }
ulid = { version = "3.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
